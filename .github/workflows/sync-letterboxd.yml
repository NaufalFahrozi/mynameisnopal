name: Sync Letterboxd cache

on:
  schedule:
    # daily, 03:17 UTC — the ledger keeps itself current while everyone sleeps
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/sync-letterboxd.mjs
      - name: Commit if the ledger moved
        run: |
          git config user.name "letterboxd-sync"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- src/data/letterboxd-cache.ts; then
            git add src/data/letterboxd-cache.ts
            git commit -m "ledger: daily letterboxd sync"
            git push
          else
            echo "Ledger unchanged — nothing to commit."
          fi
