<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>icon card (dev only)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        background: #8b8377;
      }
      .icon {
        width: 100vw;
        aspect-ratio: 1 / 1;
        background: #faf7ef;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .block {
        width: 58vw;
        height: 58vw;
        background: #b8452a;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6vw;
      }
      .n {
        font-family: 'Instrument Serif', serif;
        color: #faf7ef;
        font-size: 40vw;
        line-height: 1;
        padding-bottom: 2vw;
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="block"><span class="n">N</span></div>
    </div>
  </body>
</html>
